# Builds every download and publishes a GitHub Release.
#
# Runs when a version tag such as v3.0.0 is pushed, or by hand:
#   Actions tab → "Build and release" → "Run workflow".
#
#   windows  AK-Knockout-Studio-Setup-<version>.exe and -portable.exe
#   android  AK-Knockout-Studio-<version>.apk
#
# The APK is signed with your own key, kept in two repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Always sign with the same key: Android only installs an update over an app
# signed with the same key.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v3.0.0'
        required: true
      publish:
        description: 'Publish the files to the release (untick for a test build)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install packages (without downloading Electron)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Prepare the web app and sync it into the Android project
        run: npm run android:sync
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > android/app/release.keystore
            echo "AKKS_KEYSTORE=release.keystore" >> "$GITHUB_ENV"
            echo "AKKS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AKKS_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AKKS_KEY_ALIAS=akknockoutstudio" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::The Android signing secrets are missing. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          else
            echo "::warning::No signing secrets: building a test APK signed with a temporary key."
            keytool -genkeypair -keystore android/app/release.keystore -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 30 -storepass testtest -keypass testtest -dname "CN=Test"
            echo "AKKS_KEYSTORE=release.keystore" >> "$GITHUB_ENV"
            echo "AKKS_KEYSTORE_PASSWORD=testtest" >> "$GITHUB_ENV"
            echo "AKKS_KEY_PASSWORD=testtest" >> "$GITHUB_ENV"
            echo "AKKS_KEY_ALIAS=test" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Name and check the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AK-Knockout-Studio-${VERSION}.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "out/AK-Knockout-Studio-${VERSION}.apk"
          "$BT/aapt2" dump badging "out/AK-Knockout-Studio-${VERSION}.apk" | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          NOTES="docs/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" files/* --title "AK Knockout Studio ${TAG#v}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" files/* --title "AK Knockout Studio ${TAG#v}" --generate-notes --latest
          fi
